name: Check
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Check
    runs-on: ubuntu-latest

    permissions:
      # Required to checkout the code
      contents: read

    steps:
      - uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run lint && bun run format:check
